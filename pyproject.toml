[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BOB-BlenderOperatingBot"
version = "1.2.0"
description = "BOB - Blender Operating Bot: AI-powered Blender automation and control"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Rishabh Verma", email = "rishabh.verma@physiologie.uni-freiburg.de"}
]

dependencies = [
    "textual>=0.50.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
bob-agent = "agent_tui:main"

[tool.setuptools]
py-modules = ["agent_tui"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
